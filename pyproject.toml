[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "opensnake"
version = "3.1.0"
description = "OpenSnake: the server for snake games (accounts, points, records, versus) and the game rules its clients share"
readme = "README.md"
license = "BSD-3-Clause"
requires-python = ">=3.10"
# The game rules (opensnake.game, .speedrun, .cosmetics, ...) need nothing else, so
# clients can depend on this package; the server itself needs aiohttp.
dependencies = []
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Games/Entertainment :: Arcade",
    "Operating System :: OS Independent",
]

[project.optional-dependencies]
server = ["aiohttp>=3.9"]

[project.scripts]
opensnake-server = "opensnake.server:main"

[tool.setuptools.packages.find]
include = ["opensnake*"]
